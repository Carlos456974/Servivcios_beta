<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reporte de Servicio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      padding: 20px;
    }

    .reporte {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo label {
      font-weight: bold;
    }

    .valor {
      background: #eee;
      padding: 10px;
      border-radius: 4px;
    }

    .acciones {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="reporte">
  <h1>Reporte de Servicio</h1>

  <div class="campo"><label>Cliente</label><div id="rCliente" class="valor"></div></div>
  <div class="campo"><label>Tipo</label><div id="rTipo" class="valor"></div></div>

  <!-- RECOLECCIÓN -->
  <div id="recoleccionData" style="display:none;">
    <div class="campo"><label>N/S</label><div id="rSerie" class="valor"></div></div>
    <div class="campo"><label>Marca/Modelo</label><div id="rMarcaModelo" class="valor"></div></div>
    <div class="campo"><label>Cargador</label><div id="rCargador" class="valor"></div></div>
  </div>

  <!-- TICKET -->
  <div id="ticketData" style="display:none;">
    <div class="campo"><label>No. Ticket</label><div id="rNumeroTicket" class="valor"></div></div>
    <div class="campo"><label>Comentarios</label><div id="rComentariosTicket" class="valor"></div></div>
  </div>

  <div class="campo" id="tituloContainer">
    <label>Título</label>
    <div id="rTitulo" class="valor"></div>
  </div>

  <div class="campo"><label>Detalles</label><div id="rDetalles" class="valor"></div></div>
  <div class="campo"><label>Firma</label><div id="rFirma" class="valor"></div></div>
  <div class="campo"><label>Fecha</label><div id="rFecha" class="valor"></div></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const data = JSON.parse(localStorage.getItem("reporteData"));

  const tipos = {
    hardware: "Hardware",
    software: "Software",
    visita_general: "Visita general",
    recoleccion: "Recolección de equipo",
    ticket: "Atención a ticket"
  };

  document.getElementById("rCliente").textContent = data.cliente;
  document.getElementById("rTipo").textContent = tipos[data.tipo];

  document.getElementById("rDetalles").textContent = data.detalles;
  document.getElementById("rFirma").textContent = data.firma;
  document.getElementById("rFecha").textContent = data.fecha;

  if (!data.titulo) {
    document.getElementById("tituloContainer").style.display = "none";
  } else {
    document.getElementById("rTitulo").textContent = data.titulo;
  }

  if (data.recoleccion) {
    document.getElementById("recoleccionData").style.display = "block";
    document.getElementById("rSerie").textContent = data.recoleccion.serie;
    document.getElementById("rMarcaModelo").textContent = data.recoleccion.marcaModelo;
    document.getElementById("rCargador").textContent = data.recoleccion.cargador;
  }

  if (data.ticket) {
    document.getElementById("ticketData").style.display = "block";
    document.getElementById("rNumeroTicket").textContent = data.ticket.numero;
    document.getElementById("rComentariosTicket").textContent = data.ticket.comentarios;
  }

});
</script>

</body>
</html>
