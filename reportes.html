<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reporte</title>

<style>
body {font-family: Arial; background:#f4f6f8;}
.reporte {max-width:800px; margin:auto; background:#fff; padding:20px;}
.campo {margin-bottom:15px;}
.valor {background:#eee; padding:10px;}

.acciones {text-align:center;}
@media print {.acciones{display:none;}}
</style>
</head>

<body>

<div class="reporte">

<h1>Reporte</h1>

<div class="campo"><b>Cliente:</b><div id="rCliente" class="valor"></div></div>
<div class="campo"><b>Tipo:</b><div id="rTipo" class="valor"></div></div>

<div id="recoleccionData" style="display:none;">
  <div class="campo"><b>N/S:</b><div id="rSerie" class="valor"></div></div>
  <div class="campo"><b>Marca:</b><div id="rMarca" class="valor"></div></div>
</div>

<div id="ticketData" style="display:none;">
  <div class="campo"><b>Ticket:</b><div id="rTicket" class="valor"></div></div>
  <div class="campo"><b>Comentarios:</b><div id="rComentarios" class="valor"></div></div>
</div>

<div id="tituloCampo" class="campo">
  <b>Título:</b>
  <div id="rTitulo" class="valor"></div>
</div>

<div id="detallesCampo" class="campo">
  <b>Detalles:</b>
  <div id="rDetalles" class="valor"></div>
</div>

<div class="campo"><b>Firma:</b><div id="rFirma" class="valor"></div></div>
<div class="campo"><b>Fecha:</b><div id="rFecha" class="valor"></div></div>

<div class="acciones">
<button onclick="print()">Imprimir</button>
</div>

</div>

<script>
const data = JSON.parse(localStorage.getItem("reporteData"));

document.getElementById("rCliente").textContent = data.cliente;
document.getElementById("rTipo").textContent = data.tipo;
document.getElementById("rFirma").textContent = data.firma;
document.getElementById("rFecha").textContent = data.fecha;

if(data.titulo){
 document.getElementById("rTitulo").textContent = data.titulo;
} else {
 document.getElementById("tituloCampo").style.display="none";
}

if(data.detalles){
 document.getElementById("rDetalles").textContent = data.detalles;
}

if(data.recoleccion){
 document.getElementById("recoleccionData").style.display="block";
 document.getElementById("rSerie").textContent = data.recoleccion.serie;
 document.getElementById("rMarca").textContent = data.recoleccion.marca;
}

if(data.ticket){
 document.getElementById("ticketData").style.display="block";
 document.getElementById("rTicket").textContent = data.ticket.numero;
 document.getElementById("rComentarios").textContent = data.ticket.comentarios;

 document.getElementById("detallesCampo").style.display="none";
}
</script>

</body>
</html>
