<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reporte</title>

<style>
body {font-family: Arial; background:#f4f6f8;}

.hoja {
  max-width:800px;
  margin:30px auto;
  background:#fff;
  padding:25px;
  page-break-after: always;
}

.valor {background:#eee; padding:8px; margin-bottom:10px;}

.firmas {
  margin-top:50px;
  display:flex;
  justify-content:space-between;
}

.firma {
  width:45%;
  text-align:center;
}

.firma hr {
  margin-bottom:5px;
}

@media print {
  .acciones {display:none;}
}
</style>
</head>

<body>

<!-- 🟢 HOJA CLIENTE -->
<div class="hoja">
<h2>Reporte Cliente</h2>
<div id="cContenido"></div>

<div class="firmas">
  <div class="firma">
    <hr>
    <p id="cFirma"></p>
    <small>Firma del cliente</small>
  </div>

  <div class="firma">
    <hr>
    <p id="cTecnico"></p>
    <small>Firma del personal</small>
  </div>
</div>

</div>

<!-- 🔵 HOJA INTERNA -->
<div class="hoja">
<h2>Reporte Interno</h2>
<div id="iContenido"></div>

<div class="firmas">
  <div class="firma">
    <hr>
    <p id="iFirma"></p>
    <small>Firma del cliente</small>
  </div>

  <div class="firma">
    <hr>
    <p id="iTecnico"></p>
    <small>Firma del personal</small>
  </div>
</div>

</div>

<div class="acciones">
  <button onclick="window.print()">Imprimir</button>
</div>

<script>
const data = JSON.parse(localStorage.getItem("reporteData"));

function contenido(){
 let html = `
 <b>Cliente:</b><div class="valor">${data.cliente}</div>
 <b>Tipo:</b><div class="valor">${data.tipo}</div>
 <b>Fecha:</b><div class="valor">${data.fecha}</div>
 `;

 if(data.titulo){
  html += `<b>Título:</b><div class="valor">${data.titulo}</div>`;
 }

 if(data.ticket){
  html += `
  <b>Ticket:</b><div class="valor">${data.ticket.numero}</div>
  <b>Comentarios:</b><div class="valor">${data.ticket.comentarios}</div>`;
 } else if(data.detalles){
  html += `<b>Detalles:</b><div class="valor">${data.detalles}</div>`;
 }

 if(data.recoleccion){
  html += `
  <b>N/S:</b><div class="valor">${data.recoleccion.serie}</div>
  <b>Marca:</b><div class="valor">${data.recoleccion.marca}</div>`;
 }

 return html;
}

// CONTENIDO
document.getElementById("cContenido").innerHTML = contenido();
document.getElementById("iContenido").innerHTML = contenido();

// FIRMAS
document.getElementById("cFirma").textContent = data.firma;
document.getElementById("iFirma").textContent = data.firma;

document.getElementById("cTecnico").textContent = data.tecnico;
document.getElementById("iTecnico").textContent = data.tecnico;
</script>

</body>
</html>
