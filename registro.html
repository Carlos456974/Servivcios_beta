<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>

<div class="registro-container">
<form id="formServicio">

<label>Cliente</label>
<select id="cliente" required>
<option value="">-- Selecciona --</option>
<option>Dacis</option>
<option>GCB</option>
<option value="otro">Otro</option>
</select>

<div id="otroClienteContainer" class="hidden">
<input id="otroCliente" placeholder="Nuevo cliente">
</div>

<label>Tipo de servicio</label>
<select id="tipo" required>
<option value="">-- Selecciona --</option>
<option value="hardware">Hardware</option>
<option value="software">Software</option>
<option value="visita_general">Visita general</option>
<option value="recoleccion">Recolección</option>
<option value="ticket">Atención a ticket</option>
<option value="entrega">Entrega de equipo</option>
</select>

<!-- RECOLECCION -->
<div id="recoleccionContainer" class="hidden">
<input id="serie" placeholder="N/S">
<input id="marcaModelo" placeholder="Marca/Modelo">
</div>

<!-- TICKET -->
<div id="ticketContainer" class="hidden">
<input id="numeroTicket" placeholder="No. Ticket">
<textarea id="comentariosTicket"></textarea>
</div>

<!-- ENTREGA -->
<div id="entregaContainer" class="hidden">

<label>Marca</label>
<select id="marcaEntrega">
<option value="">-- Selecciona --</option>
<option>Lenovo</option>
<option>HP</option>
<option>Asus</option>
<option>Macbook</option>
<option>Dell</option>
<option value="na">N/A</option>
<option value="otro">Otro</option>
</select>

<div id="marcaOtroContainer" class="hidden">
<input id="marcaOtra" placeholder="Especifica la marca">
</div>

<input id="modeloEntrega" placeholder="Modelo">
<input id="serieEntrega" placeholder="Nombre o N/S">

<label>¿Se cambiaron piezas?</label>
<select id="cambioPiezas">
<option value="">-- Selecciona --</option>
<option value="no">No</option>
<option value="si">Sí</option>
</select>

<div id="piezasContainer" class="hidden">
<input id="tipoPieza" placeholder="Tipo de pieza">
<input id="serieVieja" placeholder="Serie vieja">
<input id="serieNueva" placeholder="Serie nueva">
</div>

</div>

<!-- TITULO -->
<input id="titulo" placeholder="Título">

<!-- DETALLES -->
<textarea id="detalles" placeholder="Detalles"></textarea>

<!-- FIRMA -->
<input id="firma" placeholder="Firma cliente" required>

<label>Personal</label>
<select id="tecnico" required>
<option value="">-- Selecciona --</option>
<option>Dylan (Auxiliar)</option>
<option>Carlos Dorantes (Encargado de TI)</option>
</select>

<button type="submit">Generar reporte</button>

</form>
</div>

</body>
</html>
