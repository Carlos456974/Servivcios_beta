<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Servicio | SIICOM</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>

<div class="registro-wrapper">
  <img src="imagenes/Logo SIICOM-MX (1).png" alt="Logo SIICOM">

  <div class="registro-container">
    <h2>Registrar Servicio</h2>

    <form id="formServicio">

      <!-- CLIENTE -->
      <label>Cliente</label>
      <select id="cliente" required>
        <option value="">-- Selecciona --</option>
        <option>GCB</option>
        <option>Comisa</option>
        <option value="otro">Otro</option>
      </select>

      <div id="otroClienteContainer" class="hidden">
        <input type="text" id="otroCliente" placeholder="Nuevo cliente">
      </div>

      <!-- TIPO -->
      <label>Tipo</label>
      <select id="tipo" required>
        <option value="">-- Selecciona --</option>
        <option value="hardware">Hardware</option>
        <option value="software">Software</option>
        <option value="visita_general">Visita</option>
        <option value="recoleccion">Recolección</option>
        <option value="ticket">Atención a ticket</option>
      </select>

      <!-- RECOLECCION -->
      <div id="recoleccionContainer" class="hidden">
        <input id="serie" placeholder="N/S">
        <input id="marcaModelo" placeholder="Marca/Modelo">
      </div>

      <!-- TICKET -->
      <div id="ticketContainer" class="hidden">
        <input id="numeroTicket" placeholder="No. Ticket">
        <textarea id="comentariosTicket" placeholder="Comentarios"></textarea>
      </div>

      <!-- TITULO -->
      <div id="tituloContainer">
        <input id="titulo" placeholder="Título">
      </div>

      <!-- DETALLES -->
      <div id="detallesContainer">
        <textarea id="detalles" placeholder="Detalles"></textarea>
      </div>

      <!-- FIRMA CLIENTE -->
      <input id="firma" placeholder="Firma cliente" required>

      <!-- PERSONAL -->
      <label>Personal que atendió</label>
      <select id="tecnico" required>
        <option value="">-- Selecciona --</option>
        <option>Dylan (Auxiliar)</option>
        <option>Carlos Dorantes (Encargado de TI)</option>
      </select>

      <button type="submit">Generar</button>

    </form>
  </div>
</div>

</body>
</html>
