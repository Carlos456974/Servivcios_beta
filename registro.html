<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Servicio</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>

<div class="registro-container">
<form id="formServicio">

<!-- CLIENTE -->
<label>Cliente</label>
<select id="cliente" required>
  <option value="">-- Selecciona --</option>
  <option>Dacis</option>
  <option>Bakertilly</option>
  <option>Comextaa</option>
  <option>Grupo Francisco</option>
  <option>TAM</option>
  <option>Pompa y asociados</option>
  <option>Inecex</option>
  <option>Verum</option>
  <option>GCB</option>
  <option>Comisa</option>
  <option value="otro">Otro</option>
</select>

<div id="otroClienteContainer" class="hidden">
  <input id="otroCliente" placeholder="Nuevo cliente">
</div>

<!-- 🔴 AQUÍ ESTÁ LA CLAVE: TODOS LOS TIPOS -->
<label>Tipo de servicio</label>
<select id="tipo" required>
  <option value="">-- Selecciona --</option>
  <option value="hardware">Hardware</option>
  <option value="software">Software</option>
  <option value="visita_general">Visita general</option>
  <option value="recoleccion">Recolección de equipo</option>
  <option value="ticket">Atención a ticket</option>
  <option value="entrega">Entrega de equipo</option>
</select>

<!-- RECOLECCIÓN -->
<div id="recoleccionContainer" class="hidden">
  <label>N/S</label>
  <input id="serie">

  <label>Marca / Modelo</label>
  <input id="marcaModelo">
</div>

<!-- TICKET -->
<div id="ticketContainer" class="hidden">
  <label>No. Ticket</label>
  <input id="numeroTicket">

  <label>Comentarios</label>
  <textarea id="comentariosTicket"></textarea>
</div>

<!-- ENTREGA -->
<div id="entregaContainer" class="hidden">

  <label>Marca</label>
  <select id="marcaEntrega">
    <option value="">-- Selecciona --</option>
    <option>Lenovo</option>
    <option>HP</option>
    <option>Asus</option>
    <option>Macbook</option>
    <option>Dell</option>
    <option value="na">N/A</option>
    <option value="otro">Otro</option>
  </select>

  <div id="marcaOtroContainer" class="hidden">
    <input id="marcaOtra" placeholder="Especifica la marca">
  </div>

  <label>Modelo</label>
  <input id="modeloEntrega">

  <label>Nombre o N/S</label>
  <input id="serieEntrega">

  <label>¿Se cambiaron piezas?</label>
  <select id="cambioPiezas">
    <option value="">-- Selecciona --</option>
    <option value="no">No</option>
    <option value="si">Sí</option>
  </select>

  <div id="piezasContainer" class="hidden">
    <label>Tipo de pieza</label>
    <input id="tipoPieza">

    <label>Serie pieza dañada</label>
    <input id="serieVieja">

    <label>Serie pieza nueva</label>
    <input id="serieNueva">
  </div>

</div>

<!-- TITULO -->
<label>Título</label>
<input id="titulo">

<!-- DETALLES -->
<label>Detalles</label>
<textarea id="detalles"></textarea>

<!-- FIRMA -->
<label>Firma cliente</label>
<input id="firma" required>

<!-- TECNICO -->
<label>Personal</label>
<select id="tecnico" required>
  <option value="">-- Selecciona --</option>
  <option>Dylan (Auxiliar)</option>
  <option>Carlos Dorantes (Encargado de TI)</option>
</select>

<button type="submit">Generar reporte</button>

</form>
</div>

</body>
</html>
