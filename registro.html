<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Servicio | SIICOM</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>

<div class="registro-wrapper">
  <img src="imagenes/Logo SIICOM-MX (1).png">

  <div class="registro-container">
    <h2>Registrar Servicio</h2>

    <form id="formServicio">

      <label>Cliente</label>
      <select id="cliente" required>
        <option value="">-- Selecciona un cliente --</option>
        <option>Dacis</option>
        <option>Bakertilly</option>
        <option>Comextaa</option>
        <option>Grupo Francisco</option>
        <option>TAM</option>
        <option>Pompa y asociados</option>
        <option>Inecex</option>
        <option>Verum</option>
        <option>GCB</option>
        <option>Comisa</option>
        <option value="otro">Otro</option>
      </select>

      <div id="otroClienteContainer" class="hidden">
        <input type="text" id="otroCliente" placeholder="Nuevo cliente">
      </div>

      <label>Tipo</label>
      <select id="tipo" required>
        <option value="entrega">Entrega de equipo</option>
      </select>

      <!-- ENTREGA -->
      <div id="entregaContainer">

        <label>Marca</label>
        <select id="marcaEntrega" required>
          <option value="">-- Selecciona --</option>
          <option>Lenovo</option>
          <option>HP</option>
          <option>Asus</option>
          <option>Macbook</option>
          <option>Dell</option>
          <option value="na">N/A</option>
          <option value="otro">Otro</option>
        </select>

        <div id="marcaOtroContainer" class="hidden">
          <input id="marcaOtra" placeholder="Especifica la marca">
        </div>

        <input id="modeloEntrega" placeholder="Modelo">
        <input id="serieEntrega" placeholder="Nombre o N/S">

        <label>¿Se cambiaron piezas?</label>
        <select id="cambioPiezas" required>
          <option value="">-- Selecciona --</option>
          <option value="no">No</option>
          <option value="si">Sí</option>
        </select>

        <div id="piezasContainer" class="hidden">
          <input id="tipoPieza" placeholder="Tipo de pieza">
          <input id="serieVieja" placeholder="Serie pieza dañada">
          <input id="serieNueva" placeholder="Serie pieza nueva">
        </div>

      </div>

      <textarea id="detalles" placeholder="Detalles"></textarea>

      <input id="firma" placeholder="Firma cliente" required>

      <label>Personal</label>
      <select id="tecnico" required>
        <option value="">-- Selecciona --</option>
        <option>Dylan (Auxiliar)</option>
        <option>Carlos Dorantes (Encargado de TI)</option>
      </select>

      <button type="submit">Generar reporte</button>

    </form>
  </div>
</div>

</body>
</html>
