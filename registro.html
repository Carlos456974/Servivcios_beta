<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Servicio | SIICOM</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>

  <div class="registro-wrapper">
    <img src="imagenes/Logo SIICOM-MX (1).png" alt="Logo SIICOM">

    <div class="registro-container">
      <h2>Registrar Servicio Realizado</h2>

      <form id="formServicio">

        <!-- CLIENTE -->
        <label for="cliente">Cliente</label>
        <select id="cliente" name="cliente" required>
          <option value="">-- Selecciona un cliente --</option>
          <option>Dacis</option>
          <option>Bakertilly</option>
          <option>Comextaa</option>
          <option>Grupo Francisco</option>
          <option>TAM</option>
          <option>Pompa y asociados</option>
          <option>Inecex</option>
          <option>Verum</option>
          <option>GCB</option>
          <option>Comisa</option>
          <option value="otro">Otro</option>
        </select>

        <div id="otroClienteContainer" class="hidden">
          <label>Nuevo cliente</label>
          <input type="text" id="otroCliente">
        </div>

        <!-- TIPO -->
        <label>Tipo</label>
        <select id="tipo" required>
          <option value="">-- Selecciona --</option>
          <option value="hardware">Hardware</option>
          <option value="software">Software</option>
          <option value="visita_general">Visita general</option>
          <option value="recoleccion">Recolección de equipo</option>
          <option value="ticket">Atención a ticket</option>
        </select>

        <!-- RECOLECCIÓN -->
        <div id="recoleccionContainer" class="hidden">
          <label>N/S</label>
          <input type="text" id="serie">

          <label>Marca/Modelo</label>
          <input type="text" id="marcaModelo">

          <label>Cargador</label>
          <input type="radio" name="cargador" value="Sí"> Sí
          <input type="radio" name="cargador" value="No"> No
        </div>

        <!-- TICKET -->
        <div id="ticketContainer" class="hidden">
          <label>No. Ticket</label>
          <input type="text" id="numeroTicket">

          <label>Comentarios</label>
          <textarea id="comentariosTicket"></textarea>
        </div>

        <!-- TITULO -->
        <div id="tituloContainer">
          <label>Título</label>
          <input type="text" id="titulo" required>
        </div>

        <!-- DETALLES -->
        <div id="detallesContainer">
          <label>Detalles</label>
          <textarea id="detalles" required></textarea>
        </div>

        <!-- FIRMA -->
        <label>
          Firma (debe ser quien solicitó o valide)
        </label>
        <input type="text" id="firma" required>

        <button type="submit">Generar reporte</button>

      </form>
    </div>
  </div>

</body>
</html>
